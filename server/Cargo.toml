[package]
name = "isep-assistant"
version = "0.3.0"
edition = "2021"
description = "ISEP Moodle Assistant — núcleo e API local em Rust"
license = "MIT"

[lib]
name = "isep_assistant"
path = "src/lib.rs"

[[bin]]
name = "isep-assistant-api"
path = "src/main.rs"

# Dependências escolhidas para compilar com o toolchain GNU do rustup SEM MinGW instalado:
# nenhuma pode depender de `raw-dylib` (windows-link, getrandom 0.3, windows-sys >= 0.60), porque isso
# exige o `dlltool` do MinGW. Por isso: servidor HTTP síncrono (tiny_http) e cliente HTTP sobre a WinHTTP
# do Windows (windows-sys 0.59), sem tokio/reqwest/rustls. As versões fixas no Cargo.lock também importam:
#   chrono 0.4.39, parking_lot(_core) 0.12.3 / 0.9.10, getrandom 0.2.15, ahash 0.8.11.
# Com um MinGW ou o Visual Studio C++ instalados estes limites deixam de ser necessários.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }
regex = "1"
scraper = "0.20"
tiny_http = "0.12"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
mail-parser = "0.9"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
